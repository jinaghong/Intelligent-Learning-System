# tlias 生产站点（Ubuntu 24.04 / nginx 1.24）
#
# 安装：
#   sudo cp deploy/nginx-tlias.conf /etc/nginx/sites-available/tlias
#   sudo ln -sf /etc/nginx/sites-available/tlias /etc/nginx/sites-enabled/tlias
#   sudo rm -f /etc/nginx/sites-enabled/default      # 否则 default_server 撞车
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 前端静态文件（npm run build 产物）
    root /opt/tlias/web;
    index index.html;

    # ⚠️ 必须放行：nginx 默认只有 1m，会把 1MB~2MB 的头像直接 413，
    # 而且请求根本没到后端，后端的 GlobalExceptionHandler 日志里一个字都没有
    client_max_body_size 10m;

    access_log /var/log/nginx/tlias.access.log;
    error_log  /var/log/nginx/tlias.error.log warn;

    # 后端 server.servlet.context-path 已经是 /api，
    # 所以 proxy_pass 后面绝不能带路径（带 / 会变成 /api/api/...）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 对话接口要等模型返回，30s 的默认值会偶发 504
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA 回落：浏览器直接打开 /students 或刷新页面时，磁盘上没有这个文件，
    # 必须交回 index.html 让 vue-router 接管，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，否则发版后用户还是拿到旧的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
