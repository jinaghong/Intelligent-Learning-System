# ============================================================
#  deepseek profile：打开真实 AI 调用（P8）
#
#  激活方式（两种等价）：
#    IDEA 运行配置 → 活动配置文件填：dev,deepseek
#    命令行：--spring.profiles.active=dev,deepseek（或 mvn spring-boot:run -Dspring-boot.run.profiles=dev,deepseek）
#
#  不激活这个 profile 时：走 MockAiChatServiceImpl（确定性假数据），
#  项目照常启动、接口照常能调，只是不真的花钱调模型。
#
#  真实 key 的两条路（本文件是提交版，key 永远不写在这里）：
#    1) 环境变量 DEEPSEEK_API_KEY（推荐，优先级最高）
#    2) application-local.yml 里写 spring.ai.openai.api-key: sk-xxx
#  都没配时占位值只是个「能启动」的假 key——真调用会失败并走降级，
#  ai_call_log 里记 status=0，不会把接口搞 500。
# ============================================================

spring:
  ai:
    model:
      # 默认 profile 里 chat=none 被拔了插头，这里按回来
      chat: openai
    openai:
      # DeepSeek 的 OpenAI 兼容端点（官方文档给出的兼容前缀）
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      chat:
        options:
          # 模型名待真实 key 到位后用一条 curl 验证再定稿（见 计划书-P8 第七节）
          model: deepseek-chat
