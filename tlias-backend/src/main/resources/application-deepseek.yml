# ============================================================
#  deepseek profile：打开真实 AI 调用（P8）
#
#  激活方式（两种等价）：
#    IDEA 运行配置 → 活动配置文件填：dev,deepseek
#    命令行：--spring.profiles.active=dev,deepseek（或 mvn spring-boot:run -Dspring-boot.run.profiles=dev,deepseek）
#
#  不激活这个 profile 时：走 MockAiChatServiceImpl（确定性假数据），
#  项目照常启动、接口照常能调，只是不真的花钱调模型。
#
#  真实 key 的来源（本文件是提交版，key 永远不写在这里）：
#    1) application-local.yml 的 spring.ai.openai.api-key（本机开发用这个）
#    2) 环境变量 DEEPSEEK_API_KEY（优先级最高）
#  两个都没配时，启动会失败并提示 key 未设置——这是刻意的：
#  激活 deepseek 就代表「我要真调用」，缺 key 应该立刻报错，而不是悄悄降级。
# ============================================================

spring:
  ai:
    model:
      # 默认 profile 里 chat=none 被拔了插头，这里按回来
      chat: openai
    openai:
      # DeepSeek 的 OpenAI 兼容端点。
      # 注意只写到根域名：Spring AI 会自动拼接 /v1/chat/completions，
      # 如果这里写成 https://api.deepseek.com/v1 就会变成 /v1/v1/... → 404（P8 E2E 实测踩过）。
      base-url: https://api.deepseek.com
      chat:
        options:
          # 2026-10-17 用真实 key 调用 /v1/models 实测：平台只有两个模型——
          #   deepseek-flash   （DeepSeek-V4.1-Flash，快且便宜）
          #   deepseek-v4-pro  （DeepSeek-V4-Pro，更强）
          # 原方案文档没错：deepseek-chat / deepseek-reasoner 确已退役。
          # 两模型都带推理过程（响应里返回 reasoning_content）。
          model: deepseek-flash
