spring:
  application:
    name: tlias-backend
  profiles:
    active: dev
    # profile 分组：激活 dev 时自动连带激活 local。
    # 好处是 IDEA 里直接点运行就等价于 --spring.profiles.active=dev,local，
    # 不用每次手敲启动参数（漏敲的话真实密码读不到，报错还很难看懂）。
    # local 对应 application-local.yml，已被 .gitignore 排除；
    # 该文件现在还不存在，Spring Boot 对「profile 激活了但没有对应文件」不报错。
    group:
      dev: local
  servlet:
    multipart:
      # 单个上传文件的大小上限。超了会在解析阶段被拒，
      # 提示语由 GlobalExceptionHandler 里对应的处理器给出
      #
      # 只设 max-file-size，不设 max-request-size：后者是「整个请求体」的上限，
      # 里面除了文件还有表单边界等包装字节——如果也卡成 2MB，
      # 一个刚好 2MB 的文件会因为包装开销超一点点而被误拒，很难排查。
      # 保持它的默认值 10MB 就好
      max-file-size: 2MB

  # Spring AI（P8）。spring-ai-starter-model-openai 引入后，chat/embedding/image
  # 等自动配置「默认全开」，且 bean 创建时就要读 api-key——没配 key 会导致应用起不来。
  # 所以默认 profile 把每个模型入口都设成 none（相当于拔掉插头），
  # 真实调用只在 deepseek profile 下打开（application-deepseek.yml 里改回 openai）。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: 8080
  servlet:
    # 所有接口的统一前缀。控制器里写 /health，浏览器实际访问 /api/health。
    # 前端 Vite 把 /api 代理到 8080 时就不需要再做路径重写。
    context-path: /api
